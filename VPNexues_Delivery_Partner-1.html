<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPNexues – Delivery Partner</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B2E1F;--ink2:#4B6B5C;--bg:#fff;--card:#fff;--line:#BFE0CD;--sign:#1FA463;--signtxt:#fff;--ok:#128A4F;--bad:#D64545;--soft:#DDF2E5;--tint:#F1FAF4;--dg:linear-gradient(135deg,#127A48 0%,#0B4A2E 55%,#052116 100%);--g1:#2BBF74;--g2:#0B7A44;--g3:#0B5B34;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:#052116}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.4 Figtree,system-ui,sans-serif}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
.top{padding:14px 18px 18px;display:flex;align-items:center;justify-content:space-between;background:var(--dg);color:#fff;border-radius:0 0 24px 24px;box-shadow:0 8px 20px rgba(5,33,22,.4);margin-bottom:10px}
.top h1{font-size:24px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;font-weight:600;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#FF8A80;box-shadow:0 0 0 2px rgba(255,255,255,.6)}.on .dot{background:#7CFFB2}
main{flex:1;overflow-y:auto;padding:4px 14px 20px}
nav{display:flex;background:linear-gradient(135deg,#0B4A2E,#052116);border-radius:20px 20px 0 0}
nav button{flex:1;padding:12px 0 10px;font-weight:600;font-size:12.5px;color:#9FD9B8;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button[aria-current=true]{color:#fff;box-shadow:inset 0 3px 0 #5EE79F}
nav svg{width:22px;height:22px}
.card{background:var(--tint);border:1.5px solid var(--line);border-left:6px solid var(--sign);border-radius:14px;margin:0 0 12px;overflow:hidden;box-shadow:0 2px 8px rgba(31,164,99,.12)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.head{padding:14px;width:100%;text-align:left;display:block}
.head .disp{font-size:17px;font-weight:700;color:#0B3D27}
.muted{color:var(--ink2);font-size:13.5px}
.tag{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:#C6EBD5;color:#0B5B34}
.tag.cod{background:#CDEFDB;color:#0B5B34}
.body{padding:0 14px 14px;border-top:1px dashed var(--line)}
.sec{margin-top:14px}.sec h3{font-size:14px;font-weight:700;margin-bottom:6px;color:#0B4A2E}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;font-weight:700;background:#CDEFDB;text-decoration:none;color:#0B3D27}
.btn.pri{background:var(--dg);color:#fff;box-shadow:0 4px 12px rgba(5,33,22,.3)}
.btn.go{background:linear-gradient(135deg,#0B4A2E,#04140D);color:#fff}
.btn.warn{background:transparent;border:1.5px solid var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.map{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:#CDEFDB;text-decoration:none;color:var(--ink);margin-top:8px}
.map svg{flex:none;width:44px;height:44px}
.items{margin:0;padding:0;list-style:none}.items li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.items li:last-child{border:0}
input.otp{width:100%;font:800 28px 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:.7em;text-align:center;padding:10px 0 10px .7em;border-radius:12px;border:2px solid #8CD1AA;background:#fff;color:var(--ink)}
input.otp.ok{border-color:var(--ok)}
input.f,select.f{width:100%;padding:13px;border-radius:12px;border:2px solid #8CD1AA;background:#fff;color:var(--ink);font:inherit}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:600;font-size:13.5px}
.photo{display:block;border:2px dashed #5FC48B;background:#E8F7EE;border-radius:12px;padding:16px;text-align:center;cursor:pointer}
.photo img{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:8px}
.panel{background:#D3F0DF;border-radius:12px;padding:12px;margin-top:8px}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px}
.login h1{font-size:44px;font-weight:800;line-height:1}
.bar{height:8px;width:72px;background:linear-gradient(90deg,#5EE79F,#0B4A2E);border-radius:4px;margin:14px 0 22px}
.login label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
.stat{padding:14px;text-align:center;background:var(--dg);color:#fff}.stat .muted{color:#BFE9D0}.stat b{display:block;font:800 26px 'Bricolage Grotesque',system-ui,sans-serif}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}
.switch{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked=true]{background:var(--ok)}.switch[aria-checked=true]::after{transform:translateX(20px)}
.sosb{background:var(--bad);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.7);font-weight:800;padding:7px 14px;border-radius:99px;font-size:13px;letter-spacing:.04em}
.ov{position:absolute;inset:0;background:rgba(5,15,25,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#F1FAF4;border-top:6px solid var(--sign);width:100%;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0}
.sosa{background:var(--bad);color:#fff}
.brand{font:800 12.5px 'Bricolage Grotesque',Figtree,sans-serif;color:#BFF2D3;letter-spacing:.08em;text-transform:uppercase}
.hero{background:var(--dg);color:#fff;border:0}.hero .muted{color:#D6F3E1}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);width:min(406px,calc(100% - 24px));z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.t{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;color:#fff;font-weight:600;box-shadow:0 8px 24px rgba(11,46,31,.3),0 0 0 2px rgba(255,255,255,.6);animation:tin .25s ease-out;transition:opacity .25s,transform .25s}
.t.success b{background:#052116;color:#47D68C}.t.warn b{background:#2B1A00;color:#D9A21B}
.t b{flex:none;width:24px;height:24px;border-radius:50%;background:#fff;color:#0B2E1F;display:grid;place-items:center;font-size:14px}
.t.success{background:#47D68C;color:#052116}.t.info{background:#12877E}.t.warn{background:#D9A21B;color:#2B1A00}.t.error{background:#C73B3B}.t{opacity:1}
.t.out{opacity:0!important;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.quote{display:flex;gap:10px;align-items:center;background:var(--dg);color:#fff;border-radius:16px;padding:14px 16px;margin:2px 0 14px;box-shadow:0 6px 16px rgba(5,33,22,.35)}
.qm{font:800 44px/0.7 'Bricolage Grotesque',Georgia,serif;color:#BFF2D3;align-self:flex-start;margin-top:10px}
.quote p{margin:0;font:700 16px/1.3 'Bricolage Grotesque',Figtree,sans-serif;transition:opacity .3s}
.quote small{display:block;margin-top:4px;font:500 12px Figtree,sans-serif;color:#D6F3E1}
.login{justify-content:flex-start;padding:0}
.lhero{background:var(--dg);color:#fff;padding:56px 28px 30px;border-radius:0 0 32px 32px;box-shadow:0 8px 24px rgba(11,91,52,.3)}
.lhero .disp{color:#D6F3E1!important}
.lhero .bar{background:#fff;margin:14px 0 16px}
.lform{padding:20px 28px 28px}
.lhero .quote{background:rgba(255,255,255,.16);box-shadow:none;margin:0}
.lhero{padding-bottom:26px}
.mascot{position:relative;z-index:2;display:block;width:230px;max-width:62%;height:auto;margin:-14px auto -13px;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(5,33,22,.25))}
.lform{position:relative;z-index:1;margin:0 20px 24px;padding:22px 22px 24px;background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 10px 28px rgba(11,91,52,.18)}
.lform label:first-child{margin-top:4px}
.seg{display:flex;background:var(--dg);border-radius:14px;padding:4px;margin:2px 0 12px;gap:4px}
.seg button{flex:1;padding:10px 0;border-radius:11px;font-weight:700;font-size:13.5px;color:#9FD9B8}
.seg button[aria-pressed=true]{background:#fff;color:#0B4A2E;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.big{font:800 36px/1.1 'Bricolage Grotesque',Figtree,sans-serif;margin:6px 0 2px}
.hero .sub{color:#BFE9D0;font-size:13.5px}
.hero .mini{display:flex;gap:10px;margin-top:14px}.hero .mini div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.hero .mini b{display:block;font:800 18px 'Bricolage Grotesque',Figtree,sans-serif}.hero .mini span{font-size:12px;color:#BFE9D0}
.chart{display:flex;align-items:flex-end;gap:8px;height:175px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.b{width:100%;max-width:46px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#127A48,#052116);transition:height .3s}
.b.cur{background:linear-gradient(180deg,#5EE79F,#1FA463)}
.backb{flex:none;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center}
.backb svg{width:22px;height:22px}
.lcard .head{cursor:pointer}.lcard .go{color:var(--g2);font-weight:700;font-size:13px;margin-top:8px;display:flex;justify-content:space-between}
.val{font:700 11px Figtree,sans-serif;color:#0B4A2E}.lbl{font:600 11.5px Figtree,sans-serif;color:var(--ink2)}
</style>

function login(){return '<div class="login"><div class="lhero"><div class="disp" style="font-weight:700">Delivery partner</div><h1>VPNexues</h1><div class="bar"></div>'+quoteHtml()+'</div><img class="mascot" src="'+MASCOT+'" alt="VP Nexues delivery partner peeking over the sign-in box"><div class="lform">'+
 '<label for="ph">Mobile number</label><input class="f" id="ph" inputmode="tel" placeholder="98000 00000" autocomplete="tel">'+
 '<label for="pw">PIN</label><input class="f" id="pw" type="password" inputmode="numeric" maxlength="6" placeholder="4–6 digits">'+
 '<div id="lerr" class="bad-t" style="min-height:22px;margin-top:6px"></div>'+
 '<button class="btn pri" onclick="doLogin()">Sign in</button>'+
 '<button class="btn" style="margin-top:8px" onclick="toast(\'Reset link sent by SMS\')">Forgot PIN</button>'+
 '<p class="muted" style="margin-top:16px">Demo: any 10-digit number and a 4-digit PIN.</p></div></div><div class="toast"></div>'}
function doLogin(){var p=$('#ph').value.replace(/\D/g,''),w=$('#pw').value;
 if(p.length<10){$('#lerr').textContent='Enter your 10-digit mobile number.';toast('Enter your 10-digit mobile number','error');return}
 if(w.length<4){$('#lerr').textContent='PIN must be at least 4 digits.';toast('PIN must be at least 4 digits','error');return}
 S.login=true;render();toast('Welcome back, Ravi','success');if(!S.newSent){S.newSent=1;setTimeout(newOrder,20000)}}
function orderCard(o){var s=st(o.id);
 return '<div class="card lcard"><button class="head" data-id="'+o.id+'" onclick="openOrder(this.dataset.id)" aria-label="Open order '+o.id+'"><div class="row"><span class="disp">'+o.name+'</span><span class="tag '+(o.pay.indexOf('Cash')==0?'cod':'')+'">'+o.pay+'</span></div><div class="muted" style="margin-top:2px">'+o.id+' · '+o.dist+' · '+o.eta+'</div><div class="muted" style="margin-top:6px">'+(s.picked?o.addr:'Pickup: '+o.store)+'</div><div class="go"><span>'+(s.picked?'Out for delivery':'Pickup pending')+'</span><span>Open ›</span></div></button></div>'}
function orderPage(o){var s=st(o.id);return s.picked?orderCard2(o,s):pickupCard(o,s)}
function openOrder(id){var m=$('main');S.ls=m?m.scrollTop:0;S.open=id;try{history.pushState({o:id},'','#'+id)}catch(e){}render()}
function back(){if(history.state&&history.state.o){try{history.back();return}catch(e){}}S.open=null;render(true);var m=$('main');if(m)m.scrollTop=S.ls||0}
function closeDetail(){S.open=null;try{if(history.state&&history.state.o)history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
window.addEventListener('popstate',function(e){S.open=(e.state&&e.state.o)||null;if(S.login){render(true);var m=$('main');if(m)m.scrollTop=S.open?0:(S.ls||0)}});
function pickupCard(o,s){return '<div class="card"><div class="head"><div class="row"><span class="disp">'+o.name+'</span><span class="tag">Pickup pending</span></div><div class="muted" style="margin-top:2px">'+o.id+' · '+o.dist+' · '+o.eta+'</div></div><div class="body"><div class="sec"><h3>Pick up from</h3><div>'+o.store+'</div><a class="map" href="'+mapUrl(o.store)+'" target="_blank" rel="noopener">'+I.pin+'<span><b>Open store in Google Maps</b><br><span class="muted">Head to the pickup counter</span></span></a></div><div class="sec"><h3>Package</h3><div class="row"><b>'+o.bags+(o.bags>1?' bags':' bag')+'</b>'+(o.cold?'<span class="tag">Has chilled items</span>':'')+'</div><p class="muted" style="margin:4px 0 0">Check the bag count and seals before you leave.</p></div><div class="sec"><h3>Store pickup OTP</h3><input class="otp" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="Store pickup OTP" data-id="'+o.id+'" value="'+s.potp+'" oninput="pin(this)"><div class="bad-t" style="min-height:20px;margin-top:4px">'+s.perr+'</div><button class="btn go" data-id="'+o.id+'" onclick="verifyPickup(this.dataset.id)">Confirm pickup</button><p class="muted" style="margin:6px 0 0">Demo pickup OTP: '+o.potp+'</p><a class="btn" style="margin-top:8px" href="tel:'+SUPPORT+'">Store can’t share the OTP? Call support</a></div></div></div>'}
function returnPanel(o,s){var R=['Customer refused the order','Customer unreachable','Wrong or unfindable address','Customer not at home','Other'];return '<div class="panel"><b>Return this order</b><p class="muted" style="margin:4px 0 8px">Call support first. After confirming, take the bags back to the store.</p><select class="f" aria-label="Return reason" data-id="'+o.id+'" onchange="setReason(this)"><option value="">Select a reason</option>'+R.map(function(r){return '<option'+(s.reason===r?' selected':'')+'>'+r+'</option>'}).join('')+'</select><div class="bad-t" style="min-height:20px;margin-top:4px">'+s.rerr+'</div><div class="grid2"><a class="btn" href="tel:'+SUPPORT+'">Call support</a><button class="btn warn" data-id="'+o.id+'" onclick="doReturn(this.dataset.id)">Confirm return</button></div></div>'}
function sosHtml(){return '<div class="ov" role="dialog" aria-modal="true" aria-label="Emergency help"><div class="sheet"><h2 class="disp" style="font-size:24px;font-weight:800">Need help?</h2><p class="muted">Choose what you need. Support can see your active order.</p><a class="btn sosa" href="tel:112">Call emergency services (112)</a><a class="btn pri" style="margin-top:8px" href="tel:'+SUPPORT+'">Call VPNexues support</a><button class="btn" style="margin-top:8px" onclick="shareLoc()">Share live location with support</button><div class="muted" style="min-height:22px;margin:8px 0">'+(S.loc||'')+'</div><button class="btn" onclick="closeSos()">Close</button></div></div>'}
function orderCard2(o,s){var open=S.open===o.id;
 var h='<div class="card"><div class="head"><div class="row"><span class="disp">'+o.name+'</span><span class="tag '+(o.pay.indexOf('Cash')==0?'cod':'')+'">'+o.pay+'</span></div>'+
 '<div class="muted" style="margin-top:2px">'+o.id+' · '+o.dist+' · '+o.eta+(s.picked?'':' · Pickup pending')+'</div>'+
 '<div class="muted" style="margin-top:6px">'+o.addr+'</div></div>';
 if(open){
  h+='<div class="body">'+
  '<div class="sec"><h3>Delivery address</h3><div>'+o.addr+'</div>'+
  '<a class="map" href="'+mapUrl(o.addr)+'" target="_blank" rel="noopener">'+I.pin+'<span><b>Open in Google Maps</b><br><span class="muted">Turn-by-turn directions</span></span></a></div>'+
  '<div class="sec"><h3>Package</h3><div class="row"><b>'+o.bags+(o.bags>1?' bags':' bag')+'</b>'+(o.cold?'<span class="tag">Has chilled items · deliver quickly</span>':'')+'</div></div>'+
  '<div class="sec grid2"><a class="btn" href="tel:'+o.phone+'" onclick="attempt(\''+o.id+'\',true)">Call customer</a>'+
  '<a class="btn" href="tel:'+SUPPORT+'">Call support</a></div>'+
  '<div class="sec"><h3>Having trouble?</h3><div class="grid2"><button class="btn warn" onclick="panel(\''+o.id+'\',\'noanswer\')">Customer not picking up</button><button class="btn warn" onclick="panel(\''+o.id+'\',\'nootp\')">Customer has no OTP</button></div><button class="btn warn" style="margin-top:8px" data-id="'+o.id+'" onclick="retp(this.dataset.id)">Return this order</button>';
  if(s.panel=='noanswer')h+='<div class="panel"><b>Call attempts: '+s.attempts+' of 3</b><p class="muted" style="margin:4px 0 8px">Call the customer up to 3 times, a few minutes apart. After that, our support team will take over.</p><div class="grid2"><a class="btn" href="tel:'+o.phone+'" onclick="attempt(\''+o.id+'\')">Call again</a><a class="btn pri" href="tel:'+SUPPORT+'" '+(s.attempts<3?'style="opacity:.4;pointer-events:none" aria-disabled="true"':'')+'>Call support</a></div></div>';
  if(s.panel=='nootp')h+='<div class="panel"><b>Customer can’t share the OTP</b><p class="muted" style="margin:4px 0 8px">Don’t hand over the order yet. Call support, who will verify the customer and tell you how to proceed.</p><a class="btn pri" href="tel:'+SUPPORT+'">Call support now</a><button class="btn" style="margin-top:8px" onclick="supportOk(\''+o.id+'\')">Support approved – continue</button></div>';
  if(s.panel=='return')h+=returnPanel(o,s);
  h+='</div>'+
  '<div class="sec"><h3>1. Customer OTP</h3>'+
  (s.verified?'<div class="ok-t">OTP verified'+(s.bySupport?' by support':'')+'</div>':
  '<input class="otp" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="Customer OTP" value="'+s.otp+'" oninput="this.value=this.value.replace(/\\D/g,\'\');st(\''+o.id+'\').otp=this.value">'+
  '<div class="bad-t" style="min-height:20px;margin-top:4px">'+s.err+'</div><button class="btn go" onclick="verify(\''+o.id+'\')">Verify OTP</button><p class="muted" style="margin:6px 0 0">Demo OTP for this order: '+o.otp+'</p>')+'</div>'+
  '<div class="sec"><h3>2. Photo proof</h3><label class="photo"><input type="file" accept="image/*" capture="environment" hidden onchange="photo(\''+o.id+'\',this)"><b>'+(s.photo?'Retake photo':'Take photo of delivered order')+'</b>'+(s.photo?'<img src="'+s.photo+'" alt="Delivery proof">':'<div class="muted">Show the bags at the door or with the customer</div>')+'</label></div>'+
  '<div class="sec"><button class="btn pri" '+((s.verified&&s.photo)?'':'disabled')+' onclick="finish(\''+o.id+'\')">Complete delivery</button>'+
  ((s.verified&&s.photo)?'':'<p class="muted" style="text-align:center;margin:6px 0 0">Verify the OTP and add a photo to close this order.</p>')+'</div></div>'}
 return h+'</div>'}
function pin(el){el.value=el.value.replace(/\D/g,'');st(el.dataset.id).potp=el.value}
function verifyPickup(id){var o=S.orders.filter(function(x){return x.id==id})[0],s=st(id);
 if(s.potp.length<4){s.perr='Enter the 4-digit pickup OTP.';toast('Enter the 4-digit pickup OTP','error')}else if(s.potp!==o.potp){s.perr='That OTP doesn’t match. Ask the store staff to check again.';toast('Wrong pickup OTP. Ask the store staff to check','error')}else{s.picked=true;s.perr=''}
 render(true);if(s.picked)toast('Pickup confirmed. Head to the customer')}
function goOnline(){S.online=!S.online;render(true);toast(S.online?'You are online. Orders can reach you now':'You are offline. No new orders',S.online?'success':'info')}
function newOrder(){if(!S.login||!S.online)return;S.orders.push({id:'DX-4824',name:'Suresh Babu',phone:'+919800000004',addr:'15, Lake View Rd, Adyar, Chennai 600020',dist:'3.2 km',eta:'18 min',pay:'Prepaid',otp:'2468',bags:2,cold:false,store:'VPNexues Store, Adyar, Chennai',potp:'7781'});if(S.tab=='todo')render(true);toast('New order DX-4824 assigned to you','info')}
function closeSos(){S.sos=false;S.loc='';render(true)}
function retp(id){panel(id,'return')}
function setReason(el){var s=st(el.dataset.id);s.reason=el.value;s.rerr=''}
function doReturn(id){var o=S.orders.filter(function(x){return x.id==id})[0],s=st(id);
 if(!s.reason){s.rerr='Select a reason first.';toast('Select a reason to return the order','error');render(true);return}
 S.orders=S.orders.filter(function(x){return x.id!=id});
 S.done.unshift({id:o.id,name:o.name,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),earn:0,pay:o.pay,returned:true,reason:s.reason});
 closeDetail();render();toast('Return logged. Take the bags back to the store','warn')}
function shareLoc(){S.loc='Getting your location…';render(true);
 if(!navigator.geolocation){S.loc='Location isn’t available on this device.';render(true);return}
 navigator.geolocation.getCurrentPosition(function(){S.loc='Location shared with support (demo).';render(true);toast('Location shared with support (demo)','success')},function(){S.loc='Couldn’t read your location. Call support instead.';render(true)},{timeout:8000})}
function toggle(id){S.open=S.open===id?null:id;render(true)}
function panel(id,p){var s=st(id);s.panel=s.panel===p?'':p;render(true)}
function attempt(id,silent){var s=st(id);if(s.attempts<3){s.attempts++;toast(s.attempts<3?'Call attempt '+s.attempts+' of 3 logged':'3 attempts done. You can call support now',s.attempts<3?'info':'warn')}if(!silent&&s.panel=='noanswer')setTimeout(function(){render(true)},400)}
function supportOk(id){var s=st(id);s.verified=true;s.bySupport=true;render(true);toast('Support approved the handover','info')}
function verify(id){var o=S.orders.filter(function(x){return x.id==id})[0],s=st(id);
 if(s.otp.length<4){s.err='Enter the 4-digit OTP.';toast('Enter the 4-digit OTP','error')}else if(s.otp!==o.otp){s.err='That OTP doesn’t match. Ask the customer to check their SMS.';toast('Wrong OTP. Ask the customer to check their SMS','error')}else{s.verified=true;s.err='';toast('OTP verified','success')}
 render(true)}
function photo(id,el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){st(id).photo=r.result;render(true);toast('Photo added','success')};r.readAsDataURL(f)}
function finish(id){var o=S.orders.filter(function(x){return x.id==id})[0],s=st(id);
 S.orders=S.orders.filter(function(x){return x.id!=id});
 S.done.unshift({id:o.id,name:o.name,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),earn:55+Math.round(parseFloat(o.dist)*6),otp:s.bySupport?'Support approved':'OTP',pay:o.pay,photo:s.photo});
 closeDetail();render();toast('Delivered with love. Great job!','success')}
function todo(){return quoteHtml()+'<h2 style="font-size:15px;margin:2px 4px 10px;color:var(--g2)">'+S.orders.length+' to deliver</h2>'+
 (S.orders.length?S.orders.map(orderCard).join(''):'<div class="card stat"><b>All clear</b><span class="muted">New orders will show up here.</span></div>')}
function completed(){var t=S.done.reduce(function(a,d){return a+d.earn},0);
 return quoteHtml()+'<div class="card row stat" style="justify-content:space-around"><div><b>'+S.done.filter(function(d){return !d.returned}).length+'</b><span class="muted">Delivered today</span></div><div><b>₹'+t+'</b><span class="muted">Earned today</span></div></div>'+
 S.done.map(function(d){return '<div class="card" style="padding:14px"><div class="row"><span class="disp" style="font-size:17px;font-weight:700">'+d.name+'</span><b>₹'+d.earn+'</b></div><div class="muted">'+d.id+' · '+d.time+'</div><div class="row" style="margin-top:8px"><span class="tag">'+d.pay+'</span>'+(d.returned?'<span class="bad-t">Returned · '+d.reason+'</span>':'<span class="ok-t" style="font-size:13px">Verified: '+d.otp+'</span>')+'</div>'+(d.photo?'<img src="'+d.photo+'" alt="Delivery proof" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-top:8px">':'')+'</div>'}).join('')}
function inr(n){return '₹'+n.toLocaleString('en-IN')}
function short(n){return n>=1000?(n/1000).toFixed(1).replace('.0','')+'k':''+n}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function perf(){var td=S.done.reduce(function(a,d){return a+d.earn},0),tc=S.done.filter(function(d){return !d.returned}).length;
 var R={
  day:{u:'day',t:'Last 7 days',l:['Wed','Thu','Fri','Sat','Sun','Mon','Today'],v:[640,585,720,910,860,540,td],n:[10,9,11,14,13,8,tc],note:'Green bar is today so far'},
  month:{u:'month',t:'Last 6 months',l:['May','Jun','Jul','Aug','Sep','Oct'],v:[14200,15850,16400,17900,18650,12400],n:[231,254,262,288,301,198],note:'Green bar is this month so far'},
  year:{u:'year',t:'Last 4 years',l:['2023','2024','2025','2026'],v:[112000,148500,172300,141200],n:[1820,2410,2790,2265],note:'Green bar is this year so far'}}[S.range];
 var tot=sum(R.v),cnt=sum(R.n),avg=cnt?Math.round(tot/cnt):0,mx=Math.max.apply(null,R.v),last=R.v.length-1,bi=R.v.indexOf(mx);
 var seg=[['day','Daily'],['month','Monthly'],['year','Yearly']].map(function(x){return '<button aria-pressed="'+(S.range==x[0])+'" onclick="S.range=\''+x[0]+'\';render(true)">'+x[1]+'</button>'}).join('');
 return '<div class="seg" role="group" aria-label="Earnings period">'+seg+'</div>'+
 '<div class="card hero" style="padding:16px"><div class="sub">Total earned · '+R.t+'</div><div class="big">'+inr(tot)+'</div><div class="mini"><div><b>'+cnt+'</b><span>Deliveries</span></div><div><b>'+inr(avg)+'</b><span>Avg per order</span></div></div></div>'+
 '<div class="card" style="padding:14px"><h3 class="disp" style="font-size:15px;font-weight:700;color:#0B4A2E;margin-bottom:6px">Earnings by '+R.u+'</h3><div class="chart">'+
 R.v.map(function(v,i){return '<div class="col"><span class="val">'+short(v)+'</span><div class="b'+(i==last?' cur':'')+'" style="height:'+Math.max(4,Math.round(v/mx*120))+'px"></div><span class="lbl">'+R.l[i]+'</span></div>'}).join('')+
 '</div><p class="muted" style="margin:8px 0 0;text-align:center">'+R.note+'</p></div>'+
 '<div class="grid2"><div class="card stat"><b>'+inr(mx)+'</b><span class="muted">Best '+R.u+' ('+R.l[bi]+')</span></div><div class="card stat"><b>'+inr(Math.round(tot/R.v.length))+'</b><span class="muted">Average per '+R.u+'</span></div>'+
 '<div class="card stat"><b>96%</b><span class="muted">On-time deliveries</span></div><div class="card stat"><b>91%</b><span class="muted">Order acceptance</span></div></div>'}
function profile(){return '<div class="card hero" style="padding:16px"><div class="row"><div><div class="disp" style="font-size:22px;font-weight:800">Ravi Kumar</div><div class="muted">Partner ID DP-20931 · Chennai</div></div><span class="tag">★ 4.8</span></div></div>'+
 '<div class="card" style="padding:14px"><div class="row"><div><b>Available for orders</b><div class="muted">'+(S.online?'You’re online':'You’re offline')+'</div></div><button class="switch" role="switch" aria-checked="'+S.online+'" aria-label="Available for orders" onclick="goOnline()"></button></div></div>'+
 '<div class="card" style="padding:14px"><div class="row"><span class="muted">Vehicle</span><b>Bike · TN 09 AB 1234</b></div><div class="row" style="margin-top:8px"><span class="muted">Documents</span><b class="ok-t">Verified</b></div><div class="row" style="margin-top:8px"><span class="muted">Bank payout</span><b>••• 4417</b></div></div>'+
 '<a class="btn" href="tel:'+SUPPORT+'" style="margin-bottom:8px">Call support</a><button class="btn warn" onclick="closeDetail();S.login=false;render()">Log out</button>'}
function render(keep){var a=$('#app');
 if(!S.login){a.innerHTML=login();return}
 var sc=keep&&$('main')?$('main').scrollTop:0;
 var cur=S.open&&S.orders.filter(function(x){return x.id==S.open})[0];if(S.open&&!cur)S.open=null;
 if(cur){var sp=st(cur.id).picked;
  a.innerHTML='<div class="top"><div class="row" style="justify-content:flex-start;gap:12px"><button class="backb" onclick="back()" aria-label="Back to orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div><div class="brand">'+cur.id+' · '+(sp?'Deliver':'Pick up')+'</div><h1>'+cur.name+'</h1></div></div><span class="row" style="gap:8px"><button class="sosb" onclick="S.sos=true;render(true)" aria-label="SOS emergency help">SOS</button></span></div><main>'+orderPage(cur)+'</main><div class="toast"></div>'+(S.sos?sosHtml():'');
  if(keep)$('main').scrollTop=sc;return}
 var body=S.tab=='todo'?todo():S.tab=='done'?completed():S.tab=='perf'?perf():profile();
 var T=[['todo','To deliver',I.box],['done','Completed',I.check],['perf','Performance',I.chart],['me','Profile',I.user]];
 a.innerHTML='<div class="top"><div><div class="brand">VPNexues</div><h1>'+(S.tab=='todo'?'To deliver':S.tab=='done'?'Completed':S.tab=='perf'?'Performance':'Profile')+'</h1></div><span class="row" style="gap:8px"><button class="sosb" onclick="S.sos=true;render(true)" aria-label="SOS emergency help">SOS</button><span class="pill '+(S.online?'on':'')+'"><span class="dot"></span>'+(S.online?'Online':'Offline')+'</span></span></div><main>'+body+'</main><nav>'+
  T.map(function(t){return '<button aria-current="'+(S.tab==t[0])+'" onclick="S.tab=\''+t[0]+'\';render()">'+t[2]+t[1]+'</button>'}).join('')+'</nav><div class="toast"></div>'+(S.sos?sosHtml():'');
 if(keep)$('main').scrollTop=sc}
render();
</script>
